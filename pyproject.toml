[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberwarex"
version = "0.1.0"
description = "One-line access to CyberWareX's x402 agent APIs (web search, web access, onchain query, DeFi safety) with a free trial and no API key."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "CyberWareX", email = "x402@cyberwarex.com" }]
keywords = ["x402", "ai-agents", "llm-tools", "usdc", "base", "web-search", "onchain", "defi", "langchain", "crewai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.25",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.1"]
crewai = ["crewai-tools>=0.1"]
x402 = ["x402>=0.1", "eth-account>=0.11"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://cyberwarex.com"
Documentation = "https://cyberwarex.com/agents.json"
Source = "https://cyberwarex.com"

[tool.setuptools.packages.find]
include = ["cyberwarex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
